name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'Design/*.md']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Run tests on an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); phones=[x for runtime,group in d["devices"].items() if "iOS-26-2" in runtime for x in group if x["name"].startswith("iPhone")]; print(next((x["udid"] for x in phones if x["name"] == "iPhone 17 Pro"),phones[0]["udid"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild test -project Trajets.xcodeproj -scheme Trajets -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -derivedDataPath build-test -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project Trajets.xcodeproj -scheme Trajets -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Trajets.app package/Payload/
          python3 -c 'import plistlib; p=plistlib.load(open("package/Payload/Trajets.app/Info.plist","rb")); assert p["CFBundleShortVersionString"] == "3.0"; assert p["CFBundleVersion"] == "4"; assert p["CFBundleIdentifier"] == "com.prive.trajets"; assert "CFBundleIcons" in p; assert p["NSSupportsLiveActivities"]; w=plistlib.load(open("package/Payload/Trajets.app/PlugIns/TrajetsLive.appex/Info.plist","rb")); assert w["CFBundleVersion"] == p["CFBundleVersion"]; assert w["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.widgetkit-extension"'
          cd package
          zip -qry ../Trajets.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Trajets-unsigned-ipa
          path: Trajets.ipa
          retention-days: 14
      - name: Capture the dashboard
        timeout-minutes: 4
        continue-on-error: true
        run: |
          BOOTED_ID=$(xcrun simctl list devices -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for group in d["devices"].values() for x in group if x["state"]=="Booted" and "iPhone" in x["name"]), ""))')
          if [ -n "$BOOTED_ID" ]; then DEVICE_ID="$BOOTED_ID"; fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build-test/Build/Products/Debug-iphonesimulator/Trajets.app
          xcrun simctl launch "$DEVICE_ID" com.prive.trajets
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot dashboard.png
          mkdir -p screenshots
          for SCREEN in history detail replay share statistics backup settings; do
            xcrun simctl terminate "$DEVICE_ID" com.prive.trajets || true
            xcrun simctl launch "$DEVICE_ID" com.prive.trajets --preview-gallery "$SCREEN"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/$SCREEN.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: |
            TestResults.xcresult
            dashboard.png
            screenshots/
          if-no-files-found: ignore
