name: Trajets
options:
  bundleIdPrefix: com.prive
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Trajets:
    type: application
    platform: iOS
    sources: [Trajets, Shared]
    dependencies:
      - target: TrajetsLive
        embed: true
    info:
      path: Trajets/Info.plist
      properties:
        CFBundleDisplayName: Trajets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.prive.trajets
            CFBundleURLSchemes: [trajets]
        NSLocationWhenInUseUsageDescription: Votre position permet de mesurer la vitesse et de tracer vos trajets.
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prive.trajets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: false
  TrajetsLive:
    type: app-extension
    platform: iOS
    sources: [TrajetsLive, Shared]
    info:
      path: TrajetsLive/Info.plist
      properties:
        CFBundleDisplayName: Trajets en direct
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prive.trajets.live
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  TrajetsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrajetsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Trajets
schemes:
  Trajets:
    build:
      targets:
        Trajets: all
        TrajetsTests: [test]
    test:
      targets: [TrajetsTests]
