name: Trajets
options:
  bundleIdPrefix: com.prive
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Trajets:
    type: application
    platform: iOS
    sources: [Trajets]
    info:
      path: Trajets/Info.plist
      properties:
        CFBundleDisplayName: Trajets
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Votre position permet de mesurer la vitesse et de tracer vos trajets.
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prive.trajets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: false
  TrajetsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrajetsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Trajets
schemes:
  Trajets:
    build:
      targets:
        Trajets: all
        TrajetsTests: [test]
    test:
      targets: [TrajetsTests]
